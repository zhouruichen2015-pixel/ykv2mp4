[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ykv2mp4"
version = "0.1.0"
description = "优酷 YKV 视频无损转 MP4 工具"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ykv", "youku", "mp4", "video-converter"]

[project.scripts]
ykv2mp4 = "ykv2mp4.cli:main"
